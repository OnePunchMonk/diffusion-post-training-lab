recipe: dpo
model_key: sdxl
dataset_path: data/dpo_pairs
output_dir: outputs/dpo-sdxl

resolution: 1024
learning_rate: 5.0e-6   # DPO needs a much smaller LR than LoRA-SFT
train_batch_size: 1
gradient_accumulation_steps: 8
max_train_steps: 1000
lora_rank: 8
lora_alpha: 8
mixed_precision: bf16
seed: 42
checkpointing_steps: 200

dpo_beta: 5000.0   # per Wallace et al., Diffusion-DPO uses a large beta

validation_prompts:
  - "a photorealistic portrait, natural lighting"
  - "a fantasy landscape, dramatic sky"
validation_steps: 200
