recipe: lora
model_key: sdxl
dataset_path: data/concept_dataset
output_dir: outputs/lora-sdxl

resolution: 1024
learning_rate: 1.0e-4
train_batch_size: 1
gradient_accumulation_steps: 4
max_train_steps: 1500
lora_rank: 16
lora_alpha: 16
mixed_precision: bf16
seed: 42
checkpointing_steps: 250

validation_prompts:
  - "a photo of sks concept in a forest"
  - "sks concept, studio lighting, product photo"
validation_steps: 250
