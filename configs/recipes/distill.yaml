recipe: distill
model_key: sdxl
dataset_path: prompts/distill_seed_prompts.txt
output_dir: outputs/distill-sdxl

resolution: 1024
learning_rate: 1.0e-5
train_batch_size: 1
gradient_accumulation_steps: 4
max_train_steps: 3000
lora_rank: 64   # distillation needs more capacity than a style LoRA
lora_alpha: 64
mixed_precision: bf16
seed: 42
checkpointing_steps: 500

teacher_ddim_steps: 50
ema_decay: 0.95

validation_prompts:
  - "a cup of coffee on a wooden table, morning light"
validation_steps: 500
