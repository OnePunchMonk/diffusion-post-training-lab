[project]
name = "dptlab"
version = "0.1.0"
description = "Post-training lab for open-weight diffusion models (LoRA fine-tuning, Diffusion-DPO, GRPO, step-distillation) with a built-in eval harness and Hugging Face Hub publishing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "diffusers>=0.30",
    "transformers>=4.44",
    "accelerate>=0.33",
    "peft>=0.12",
    "safetensors>=0.4",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
train = ["bitsandbytes>=0.43", "xformers>=0.0.27", "datasets>=2.20", "wandb>=0.17"]
eval = ["scipy>=1.13", "torchmetrics>=1.4", "open-clip-torch>=2.26"]
serve = ["modal>=0.64", "fastapi>=0.111"]  # optional: only needed for the reference Modal serving example
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
dptlab = "dptlab.eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dptlab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
